<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paseos">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Paseos</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--ac:#38bdf8;--bad:#f87171;--ok:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:14px}
h2{margin:6px 0 12px}.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
input,button{width:100%;font:inherit;color:var(--tx);background:#0b1220;border:1px solid #334155;border-radius:12px;padding:13px;margin-bottom:10px}
button.pri{background:var(--ac);color:#04212f;font-weight:700;border:0}
.seg{display:flex;gap:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;margin:0;padding:10px 0;font-size:13px;color:var(--mut)}nav .on{color:var(--ac);font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #334155}.row:last-child{border:0}
.mut{color:var(--mut);font-size:13px}.big{font-size:32px;font-weight:700}.neg{color:var(--bad)}.pos{color:var(--ok)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.v{display:none}.v.on{display:block}
</style></head><body>
<div id="toast"></div>
<main>
<section class="v on" id="v-p"><h2>Paseo</h2><div id="pp"></div>
 <div class="card"><b>Cargar a mano</b><div class="mut">Con las horas reales; se aplica el mismo redondeo.</div><br>
 <input id="mf" type="date"><div class="seg"><input id="mi" type="time"><input id="mo" type="time"></div><button id="mc">Calcular</button></div>
 <div class="mut" id="st"></div></section>
<section class="v" id="v-d"></section>
<section class="v" id="v-h"></section>
<section class="v" id="v-x"><h2>Configuración</h2><div class="card">
 <div class="mut">Se guardan solo en este teléfono.</div><br>
 <input id="u" placeholder="URL de la app web (termina en /exec)"><input id="k" type="password" placeholder="Clave">
 <input id="pr" inputmode="numeric" placeholder="Precio por hora ($)"><button class="pri" id="gc">Guardar</button></div></section>
</main>
<nav><button data-v="p" class="on">Paseo</button><button data-v="d">Pendientes</button><button data-v="h">Historial</button><button data-v="x">Ajustes</button></nav>
<script>
const $=s=>document.querySelector(s),L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},S=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let cfg=L('cfg',{}),rows=L('rows',[]),q=L('q',[]),act=L('act',null),pv=null,sel=new Set();
const fm=n=>(+n||0).toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
const p2=n=>String(n).padStart(2,'0'),hm=m=>p2(Math.floor(m/60))+':'+p2(m%60),tm=s=>{const[a,b]=s.split(':').map(Number);return a*60+b},mins=d=>d.getHours()*60+d.getMinutes();
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),hoy=()=>ymd(new Date()),fd=f=>f.split('-').reverse().slice(0,2).join('/'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2400)};
// Regla: salida sube al múltiplo de 10; duración real al múltiplo de 10 más cercano (mínimo 10); vuelta = salida + duración
function calc(i,o){const s=Math.ceil(i/10)*10;let d=Math.round((o-i)/10)*10;if(d<10)d=10;return{s,e:s+d,d,m:Math.round(d*cfg.pr/60)}}
function precioOk(){if(!cfg.pr){toast('Cargá el precio por hora en Ajustes');nav('x');return false}return true}
function nav(v){document.querySelectorAll('.v').forEach(e=>e.classList.toggle('on',e.id=='v-'+v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.v));
function ini(){if(!precioOk())return;act=Date.now();S('act',act);rP()}
function fin(){const a=new Date(act),i=mins(a);let o=mins(new Date());if(o<i)o+=1440;pv={f:ymd(a),...calc(i,o),ri:i,ro:o};act=null;S('act',null);rP()}
$('#mc').onclick=()=>{if(!precioOk())return;if(!$('#mf').value||!$('#mi').value||!$('#mo').value){toast('Completá fecha y horas');return}
 const i=tm($('#mi').value),o=tm($('#mo').value);if(o<=i){toast('La hora de fin debe ser mayor');return}pv={f:$('#mf').value,...calc(i,o),ri:i,ro:o};rP()};
function guardar(){q.push({a:'agregar',id:uid(),fecha:pv.f,ini:hm(pv.s),fin:hm(pv.e),monto:pv.m});S('q',q);pv=null;toast('Guardado');render();sync()}
function rP(){let h='';
 if(pv)h=`<div class="card"><div class="mut">${fd(pv.f)} · real ${hm(pv.ri)}–${hm(pv.ro)}</div><div class="big">${hm(pv.s)} → ${hm(pv.e)}</div><div>${pv.d} min · <b class="pos">${fm(pv.m)}</b></div></div><button class="pri" onclick="guardar()">Guardar</button><button onclick="pv=null;rP()">Descartar</button>`;
 else if(act)h=`<div class="card"><div class="mut">Paseando desde ${hm(mins(new Date(act)))}</div><div class="big" id="cr">00:00:00</div></div><button class="pri" style="background:var(--bad);color:#fff" onclick="fin()">■ Terminar paseo</button>`;
 else h=`<button class="pri" style="padding:28px;font-size:20px" onclick="ini()">▶ Iniciar paseo</button>`;
 $('#pp').innerHTML=h;tick()}
function tick(){if(act&&$('#cr')){const s=Math.floor((Date.now()-act)/1000);$('#cr').textContent=[s/3600|0,(s/60|0)%60,s%60].map(p2).join(':')}}
setInterval(tick,1000);
function tog(e){e.checked?sel.add(+e.dataset.r):sel.delete(+e.dataset.r);rD()}
function pagar(){const rs=rows.filter(r=>sel.has(r.r)).map(r=>({r:r.r,f:r.f,m:r.m}));q.push({a:'pagar',id:uid(),rows:rs});rows.forEach(r=>{if(sel.has(r.r))r.p=true});sel.clear();S('q',q);S('rows',rows);toast('Marcado como pagado');render();sync()}
function rD(){const un=q.filter(x=>x.a=='agregar'),pe=rows.filter(r=>!r.p).sort((a,b)=>a.r-b.r),mes=hoy().slice(0,7);
 const tot=pe.reduce((s,r)=>s+r.m,0)+un.reduce((s,x)=>s+x.monto,0),cob=rows.filter(r=>r.p&&r.f.slice(0,7)==mes).reduce((s,r)=>s+r.m,0);
 const it=r=>`<label class="row"><span><input type="checkbox" style="width:auto;margin:0 10px 0 0" data-r="${r.r}" ${sel.has(r.r)?'checked':''} onchange="tog(this)">${fd(r.f)} · ${r.i}–${r.o}</span><b>${fm(r.m)}</b></label>`;
 const lista=un.map(x=>`<div class="row"><span>⏳ ${fd(x.fecha)} · ${x.ini}–${x.fin}</span><b>${fm(x.monto)}</b></div>`).join('')+pe.map(it).join('');
 $('#v-d').innerHTML=`<h2>Pendientes</h2><div class="card"><div class="mut">Pendiente de cobro</div><div class="big neg">${fm(tot)}</div><div class="mut">Cobrado este mes: ${fm(cob)}</div></div><div class="card">${lista||'<div class="mut">No hay pagos pendientes 🎉</div>'}</div>`+(sel.size?`<button class="pri" onclick="pagar()">Marcar ${sel.size} como pagado(s) · ${fm(pe.filter(r=>sel.has(r.r)).reduce((s,r)=>s+r.m,0))}</button>`:'')}
function rH(){const un=q.filter(x=>x.a=='agregar').map(x=>({id:x.id,f:x.fecha,i:x.ini,o:x.fin,m:x.monto,w:1})),all=[...un,...rows.slice().sort((a,b)=>b.r-a.r)];
 $('#v-h').innerHTML='<h2>Historial</h2><div class="card">'+(all.map(r=>`<div class="row" onclick="del(${r.w?`'${r.id}'`:r.r})"><div><b>${fm(r.m)}</b> ${r.w?'⏳':r.p?'<span class="pos">✓ pagado</span>':'<span class="mut">· sin pagar</span>'}<div class="mut">${r.i}–${r.o}</div></div><div class="mut">${fd(r.f)}</div></div>`).join('')||'<div class="mut">Sin paseos</div>')+'</div><div class="mut">Tocá un paseo para borrarlo.</div>'}
function del(x){if(!confirm('¿Borrar este paseo?'))return;
 if(typeof x=='string')q=q.filter(e=>e.id!=x);else{const r=rows.find(e=>e.r==x);q.push({a:'borrar',id:uid(),r:x,f:r.f,m:r.m});rows=rows.filter(e=>e.r!=x);S('rows',rows)}
 S('q',q);render();sync()}
function render(){rP();rD();rH();const n=q.length;$('#st').textContent=!cfg.url?'Falta configurar en Ajustes':n?`⏳ ${n} cambio(s) pendiente(s) de enviar`:'✓ Todo enviado'}
async function api(b){const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...b,t:cfg.t})});return r.json()}
async function cargar(){if(!cfg.url||!navigator.onLine)return;try{const r=await(await fetch(cfg.url+'?t='+encodeURIComponent(cfg.t))).json();if(r.ok){rows=r.rows;S('rows',rows)}else toast(r.error)}catch(e){}}
let busy=0;async function sync(){if(busy||!cfg.url||!navigator.onLine)return;busy=1;
 try{while(q.length){const r=await api(q[0]);if(r.error){toast(r.error);break}q.shift();S('q',q);if(!r.ok)toast('Un cambio no coincidió con la hoja: revisala')}if(!q.length)await cargar()}catch(e){}
 busy=0;render()}
$('#gc').onclick=()=>{cfg={url:$('#u').value.trim(),t:$('#k').value.trim(),pr:parseFloat($('#pr').value.replace(',','.'))||0};S('cfg',cfg);toast('Guardado');nav('p');render();sync()};
$('#u').value=cfg.url||'';$('#k').value=cfg.t||'';$('#pr').value=cfg.pr||'';$('#mf').value=hoy();
if(!cfg.url)nav('x');render();
addEventListener('online',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(!$('#mf').value)$('#mf').value=hoy();sync()}});sync();cargar().then(render);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
